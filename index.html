<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Clash of Critters Stage Clearance Image Gallery</h1>
        <h3>Search by tags, e.g.</h3>
        <ul>
          <li>stage number (e.g. 25-30, 26-1) </li>
          <li>Tata's level (e.g. 532) </li>
        </ul>
        <h4>Note: the formation in screenshot is for the previous stage</h4>
        <input id="search" type="search" placeholder="Search images..." aria-label="Search images" />
    </header>
    <main>
        <p id="status">Loading...</p>
        <div id="gallery" class="gallery"></div>
    </main>
    <div id="lightbox" class="lightbox" hidden>
        <img id="lightbox-img" src="" alt="" />
    </div>
    <script src="app.js"></script>
</body>
</html>
